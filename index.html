<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Community Indie Playlist</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
        .item { border: 1px solid #ccc; padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 8px; margin-top: 10px; display: block; }
        .btn-listen { display: block; width: 100%; padding: 12px; margin-top: 15px; background: #1DB954; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Chatsong Community Indie Playlist</h1>
    <div class="gallery" id="playlist-container"></div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbxbiBZ55gBz3Y-XTLDdE_cvQX3wb4w5cKtgUINqXrBek-LthtXb2DYz1G6v29SviXlV/exec';

        function getEmbedUrl(link) {
            if (!link) return "";
            if (link.includes("soundcloud.com")) return "https://w.soundcloud.com/player/?url=" + encodeURIComponent(link) + "&visual=false";
            if (link.includes("youtube.com") || link.includes("youtu.be")) {
                let videoId = link.includes("v=") ? link.split("v=")[1].split("&")[0] : link.split("youtu.be/")[1].split("?")[0];
                return "https://www.youtube.com/embed/" + videoId;
            }
            return link;
        }

        fetch(url)
        .then(response => response.json())
        .then(json => {
            const container = document.getElementById('playlist-container');
            container.innerHTML = ""; 
            
            if (json && json.formResponses1) {
                json.formResponses1.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    
                    // Gebruik hier de exacte namen uit je data met spaties tussen haakjes
                    const pName = item["playlist name"] || 'Geen titel';
                    const pUrl = item["playlist url"] || '';
                    const pService = item["streaming service"] || 'Muziek';
                    const pBy = item["created by"] || 'Community';
                    
                    div.innerHTML = `
                        <h3>${pName}</h3>
                        <p><strong>Service:</strong> ${pService}</p>
                        <p><strong>Door:</strong> ${pBy}</p>
                        <iframe src="${getEmbedUrl(pUrl)}" allowfullscreen></iframe>
                        <a href="${pUrl}" target="_blank" class="btn-listen">🎧 Open in App</a>
                    `;
                    container.appendChild(div);
                });
            }
        });
    </script>
</body>
</html>
